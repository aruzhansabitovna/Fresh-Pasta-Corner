<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#922d25"><title>Fresh Pasta Corner | Cooking Rush Deluxe</title><style>
:root{--red:#a83b2e;--cream:#fff3d8;--brown:#4c2c20;--green:#347a50;--gold:#f5bd54}*{box-sizing:border-box}body{margin:0;background:#2b201d;color:var(--brown);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{max-width:510px;min-height:100dvh;margin:auto;background:#fff3d8;position:relative;overflow:hidden;box-shadow:0 0 60px #0006}.top{background:linear-gradient(130deg,#b53b2c,#80251f);color:#fff;padding:13px 14px;text-align:center;border-bottom:5px solid #f6c569}.brand{font-family:Georgia,serif;font-size:26px;font-weight:900}.sub{font-size:10px;letter-spacing:4px;font-weight:800}.stats{display:flex;gap:7px;padding:10px;background:#ffe1ac}.stat{flex:1;text-align:center;background:#fffaf0;border:2px solid #efbf75;border-radius:15px;padding:7px 3px;font-size:10px;font-weight:800}.stat b{display:block;font-size:21px;color:#9e382d}.track{height:9px;background:#f2cc8d;margin:0 12px 10px;border-radius:20px;overflow:hidden}.track i{display:block;background:#3d9b62;height:100%;transition:width .4s}.awning{height:21px;background:repeating-linear-gradient(90deg,#b7382d 0 33px,#fff0d4 33px 66px);border-bottom:5px solid #dfaa66}.customer{background:linear-gradient(#ffdba4 0 73%,#ae6848 73%);display:flex;align-items:center;justify-content:space-around;gap:10px;padding:15px 13px;min-height:135px}.avatar{font-size:66px;filter:drop-shadow(0 5px 1px #0002);animation:bob 2.5s ease-in-out infinite}.speech{background:white;border:3px solid #b56a45;border-radius:18px;padding:12px;flex:1;box-shadow:0 5px #86462c;font-size:14px}.speech b{font-size:17px}.chef{font-size:44px}.stepbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 5px;font-weight:900;color:#8b3327}.pill{background:#3c865a;color:white;border-radius:20px;padding:5px 10px;font-size:11px}.kitchen{margin:8px 13px 11px;background:linear-gradient(155deg,#f5c88c,#e9a76d);border:9px solid #b87946;border-radius:27px;min-height:235px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 0 0 4px #f9dcaa,0 6px #8c4b31}.kitchen:before{content:'';position:absolute;top:20px;left:10%;width:80%;height:10px;border-radius:20px;background:#ffffff35}.pot{position:relative;width:185px;height:128px;display:flex;align-items:center;justify-content:center}.potbody{position:absolute;bottom:9px;width:158px;height:99px;border:8px solid #718c96;background:linear-gradient(100deg,#b5c9c9,#e1e5dd,#8ca9ac);border-radius:15px 15px 55px 55px;box-shadow:0 10px 0 #a9704d}.potbody:before{content:'';position:absolute;top:-18px;left:-6px;width:154px;height:34px;background:#d3e5e0;border:8px solid #718c96;border-radius:50%}.handle{position:absolute;top:55px;width:36px;height:16px;background:#6e838a;border-radius:15px}.handle.left{left:-11px}.handle.right{right:-11px}.steam{position:absolute;top:-17px;font-size:28px;animation:steam 1.5s infinite;opacity:.6}.steam:nth-child(2){left:48px;animation-delay:.4s}.steam:nth-child(3){right:42px;animation-delay:.8s}.food{position:absolute;z-index:3;top:20px;font-size:62px;animation:pop .45s both}.flame{font-size:25px;animation:flicker .45s infinite alternate}.station{background:#5e4036;color:#fff5df;border-radius:20px;padding:5px 16px;font-size:11px;font-weight:900;letter-spacing:2px;margin-top:5px}.recipe{margin:0 13px 12px;border:2px dashed #d6a368;background:#fff9e9;border-radius:15px;padding:10px 12px;font-size:13px}.recipe strong{color:#8d3b2a}.recipe button{float:right;border:0;background:#efd19d;border-radius:9px;padding:5px 9px;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:8px 13px 17px}.choice{border:3px solid #e3b47a;background:#fffaf1;border-radius:17px;min-height:102px;padding:8px 3px;box-shadow:0 5px #c78e55;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;transition:transform .15s,background .15s}.choice:active{transform:translateY(4px);box-shadow:0 1px #c78e55}.choice span{font-size:39px}.choice b{font-size:12px;line-height:1.15}.choice.correct{background:#d7f6d8;border-color:#4b9b5a}.choice.wrong{background:#ffd6d0;border-color:#d46b5e}.hint{padding:0 16px 12px;font-size:12px;color:#805b42;text-align:center}.overlay{position:absolute;inset:0;background:#21130edc;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:100%;background:#fff2d3;border:6px solid #f1b96a;border-radius:28px;padding:22px 16px;text-align:center;box-shadow:0 12px #7a3628}.panel h1{font-family:Georgia,serif;color:#9e352b;font-size:35px;margin:7px 0}.panel p{line-height:1.5}.bigart{font-size:94px;animation:bob 2s infinite}.primary{background:#ac382c;color:white;border:0;border-bottom:6px solid #71221b;border-radius:16px;padding:15px 22px;font-weight:900;font-size:18px;width:100%;margin-top:12px}.secondary{background:#f7dfb5;color:#7c3328;border:2px solid #d6a06a;border-radius:12px;padding:9px 12px;font-weight:800}.result{font-size:70px;animation:pop .45s both}.float{position:absolute;z-index:9;top:36%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:1000;color:#21884c;text-shadow:2px 2px white;animation:rise 1.2s forwards;pointer-events:none;white-space:nowrap}.tiny{font-size:12px;opacity:.8}.footer{display:flex;justify-content:center;padding:0 10px 16px;gap:8px}.footer button{font-size:12px}.shake{animation:shake .3s}.plate{font-size:92px;animation:pop .5s both}.bubble{position:absolute;border:2px solid #fff8;border-radius:50%;width:13px;height:13px;bottom:35px;animation:bubbles 1.1s infinite}.bubble:nth-child(2){left:40%;animation-delay:.4s}.bubble:nth-child(3){left:65%;animation-delay:.8s}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes steam{to{transform:translateY(-35px);opacity:0}}@keyframes flicker{to{transform:scale(1.2)}}@keyframes rise{to{opacity:0;transform:translate(-50%,-95px)}}@keyframes bubbles{to{bottom:110px;opacity:0}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(min-width:700px){#app{min-height:100vh}}
</style></head><body><div id="app"></div><script>
const dishes=[
{name:'Spaghetti Pomodoro',p:'Spaghetti',s:'Tomato',t:'Basil',emoji:'🍝',desc:'Classic tomato sauce with fresh basil.'},
{name:'Fettuccine Alfredo',p:'Fettuccine',s:'Cream',t:'Parmesan',emoji:'🍜',desc:'Silky cream sauce finished with Parmesan.'},
{name:'Penne Arrabbiata',p:'Penne',s:'Spicy Tomato',t:'Chili Flakes',emoji:'🍝',desc:'Spicy Roman-style tomato pasta.'},
{name:'Pesto Fusilli',p:'Fusilli',s:'Basil Pesto',t:'Pine Nuts',emoji:'🥗',desc:'Fragrant basil pesto and toasted pine nuts.'},
{name:'Mushroom Tagliatelle',p:'Tagliatelle',s:'Mushroom Cream',t:'Parsley',emoji:'🍜',desc:'Creamy mushroom sauce with parsley.'},
{name:'Ravioli Ricotta',p:'Ravioli',s:'Sage Butter',t:'Parmesan',emoji:'🥟',desc:'Stuffed pasta tossed in fragrant sage butter.'},
{name:'Linguine al Limone',p:'Linguine',s:'Lemon Butter',t:'Parsley',emoji:'🍋',desc:'Bright lemon butter with fresh parsley.'},
{name:'Rigatoni Bolognese',p:'Rigatoni',s:'Meat Ragù',t:'Parmesan',emoji:'🍝',desc:'Slow-cooked meat ragù and Parmesan.'},
{name:'Gnocchi Sorrentina',p:'Gnocchi',s:'Tomato',t:'Mozzarella',emoji:'🧀',desc:'Soft potato gnocchi with tomato and mozzarella.'},
{name:'Pappardelle Funghi',p:'Pappardelle',s:'Mushroom Cream',t:'Truffle',emoji:'🍄',desc:'Wide pasta ribbons with mushrooms and truffle.'}];
const icons={'Spaghetti':'🍝','Fettuccine':'🍜','Penne':'🍝','Fusilli':'🌀','Tagliatelle':'🍜','Ravioli':'🥟','Linguine':'🍝','Rigatoni':'🍝','Gnocchi':'🥔','Pappardelle':'🍜','Tomato':'🍅','Cream':'🥛','Spicy Tomato':'🌶️','Basil Pesto':'🌿','Mushroom Cream':'🍄','Sage Butter':'🧈','Lemon Butter':'🍋','Meat Ragù':'🥩','Basil':'🌱','Parmesan':'🧀','Chili Flakes':'🌶️','Pine Nuts':'🥜','Parsley':'🌿','Mozzarella':'🧀','Truffle':'🍄'};
const people=['👩🏽','👨🏻','👩🏼','👨🏿','👩🏻','👨🏽','👩🏿','👨🏼','👩🏾','👨🏻'];let order=0,step=0,score=0,perfect=0,mistakes=0,selected='',recipeOpen=true,soundOn=true,locked=false,finished=false;const app=document.getElementById('app');let audio;
function sound(type){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.type=type==='bad'?'sawtooth':'sine';osc.frequency.setValueAtTime(type==='bad'?180:type==='win'?660:420,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(type==='bad'?110:type==='win'?990:600,audio.currentTime+.17);gain.gain.setValueAtTime(.07,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);osc.start();osc.stop(audio.currentTime+.26)}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function options(){let d=dishes[order],key=['p','s','t'][step===0?0:step===2?1:2],answer=d[key];let pool=[...new Set(dishes.map(x=>x[key]))].filter(x=>x!==answer);return shuffle([answer,...shuffle(pool).slice(0,5)])}let opts=[];
function header(){return `<div class="top"><div class="brand">🍝 Fresh Pasta Corner</div><div class="sub">COOKING RUSH DELUXE</div></div><div class="stats"><div class="stat">⭐ SCORE<b>${score}</b></div><div class="stat">🍽️ ORDER<b>${Math.min(order+1,10)} / 10</b></div><div class="stat">💚 PERFECT<b>${perfect}</b></div></div><div class="track"><i style="width:${order*10}%"></i></div><div class="awning"></div>`}
function kitchen(){let names=['PASTA STATION','BOILING STATION','SAUCE STATION','PLATING STATION'];let art=step===3?'🍽️':step===2?'🍳':'🍲';return `<div class="kitchen" id="kitchen"><div class="pot">${step===1?'<div class="steam">♨️</div><div class="steam">♨️</div><div class="steam">♨️</div>':''}${step===1?'<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>':''}<div class="handle left"></div><div class="handle right"></div><div class="potbody"></div><div class="food">${step===3?'🍽️':step===2?'🍅':step===1?'🍝':'💧'}</div></div><div class="flame">${step===1?'🔥🔥🔥':step===2?'🔥🔥':'✨'}</div><div class="station">${names[step]}</div></div>`}
function render(){if(finished)return end();let d=dishes[order],titles=['1. Choose fresh pasta','2. Cook the pasta','3. Add the sauce','4. Finish the dish'];let controls=step===1?`<div class="choices" style="grid-template-columns:1fr"><button class="primary" onclick="cook()">🔥 BOIL PASTA</button></div>`:`<div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="pick(${i})"><span>${icons[o]||'🍽️'}</span><b>${o}</b></button>`).join('')}</div>`;app.innerHTML=header()+`<div class="customer"><div class="avatar">${people[order]}</div><div class="speech"><b>One ${d.name}, please!</b><div class="tiny">Freshly made, just for me!</div></div><div class="chef">👨🏻‍🍳</div></div><div class="stepbar"><span>${titles[step]}</span><span class="pill">STEP ${step+1} / 4</span></div>${kitchen()}<div class="recipe"><button onclick="recipeOpen=!recipeOpen;render()">${recipeOpen?'Hide':'Show'}</button><strong>📖 Chef's recipe</strong>${recipeOpen?`<div style="margin-top:7px"><b>Pasta:</b> ${d.p} · <b>Sauce:</b> ${d.s} · <b>Finish:</b> ${d.t}<p style="margin:6px 0 0">${d.desc}</p></div>`:''}</div>${controls}<div class="hint">${step===1?'Watch your pasta cook!':'Tap the ingredient that matches the customer’s recipe.'}</div><div class="footer"><button class="secondary" onclick="soundOn=!soundOn;render()">${soundOn?'🔊 Sound On':'🔇 Sound Off'}</button><button class="secondary" onclick="recipeOpen=!recipeOpen;render()">📖 Recipe Book</button></div>`}
function pop(msg){let el=document.createElement('div');el.className='float';el.textContent=msg;app.append(el);setTimeout(()=>el.remove(),1150)}function next(){step++;if(step===4){complete();return}opts=options();render()}
function pick(i){if(locked)return;let d=dishes[order],key=step===0?'p':step===2?'s':'t',value=opts[i],btn=document.querySelectorAll('.choice')[i];if(value===d[key]){locked=true;btn.classList.add('correct');sound('good');score+=20;pop('+20 ⭐');setTimeout(()=>{locked=false;next()},560)}else{mistakes++;score=Math.max(0,score-10);btn.classList.add('wrong');sound('bad');pop('−10 ⭐');document.querySelector('.kitchen').classList.add('shake');setTimeout(()=>{btn.classList.remove('wrong');document.querySelector('.kitchen')?.classList.remove('shake')},350);document.querySelector('.stat b').textContent=score}}
function cook(){if(locked)return;locked=true;sound('good');document.querySelector('.primary').textContent='🍝 COOKING...';setTimeout(()=>{score+=20;pop('+20 ⭐');locked=false;next()},1350)}
function complete(){let d=dishes[order],isPerfect=mistakes===0;if(isPerfect){score+=40;perfect++}sound('win');app.innerHTML=header()+`<div class="customer"><div class="avatar">${people[order]}</div><div class="speech"><b>${isPerfect?'Amazing! Perfect pasta!':'Thank you, chef!'}</b><div class="tiny">${isPerfect?'★★★★★':'★★★★☆'}</div></div><div class="chef">👨🏻‍🍳</div></div><div style="text-align:center;padding:22px"><div class="plate">${d.emoji}</div><h1 style="font-family:Georgia,serif;color:#9e352b">${d.name}</h1><h2>${isPerfect?'🌟 PERFECT ORDER!':'🍽️ ORDER SERVED!'}</h2><h2 style="color:#28814b">${isPerfect?'+40 PERFECT BONUS!':'Well done!'}</h2><p>Score: <b>${score}</b></p><button class="primary" onclick="advance()">${order===9?'🏆 SEE RESULTS':'➡️ NEXT CUSTOMER'}</button></div>`}
function advance(){order++;mistakes=0;step=0;if(order===10){finished=true;end()}else{opts=options();render()}}
function end(){let rank=score>=850?'MASTER PASTA CHEF':score>=600?'SUPER SOUS CHEF':'RISING PASTA STAR';app.innerHTML=header()+`<div class="overlay"><div class="panel"><div class="bigart">🏆</div><h1>Kitchen Closed!</h1><h2>${rank}</h2><p>You've served all 10 customers!</p><h1>${score} ⭐</h1><p>💚 Perfect orders: <b>${perfect} / 10</b></p><button class="primary" onclick="start()">🔄 PLAY AGAIN</button></div></div>`}
function start(){order=0;step=0;score=0;perfect=0;mistakes=0;finished=false;opts=options();render();sound('win')}
function welcome(){app.innerHTML=`<div class="top"><div class="brand">🍝 Fresh Pasta Corner</div><div class="sub">COOKING RUSH DELUXE</div></div><div class="awning"></div><div class="overlay" style="top:73px"><div class="panel"><div class="bigart">👩‍🍳🍝</div><h1>Welcome, Chef!</h1><p>Run your own Italian pasta corner. Cook delicious meals, serve 10 customers and earn stars!</p><p style="font-size:14px">📖 Follow each recipe<br>🔥 Cook and plate your pasta<br>⭐ Earn points and perfect bonuses</p><button class="primary" onclick="start()">▶ PLAY NOW</button><p class="tiny">+20 per correct step · +40 perfect bonus · −10 per mistake</p></div></div>`}welcome();
</script></body></html>
